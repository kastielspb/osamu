# ---------------------------------------------------------------------------
# Pico-MMU Klipper Integration-Test Configuration
#
# Designed for the Docker integration-test environment.  Two Linux-process
# MCU instances are started by the container entrypoint:
#
#   /klipper/out/klipper.elf -I /tmp/klipper_primary   (primary MCU)
#   /klipper/out/klipper.elf -I /tmp/klipper_pmu        (pmu MCU)
#
# The pmu MCU has the pico_mmu RS485 commands compiled in and connects to
# slave_simulator.py (TCP :9000) when config_pmu_rs485 is received.
# The primary MCU serves only to satisfy Klipper's startup requirements
# when kinematics = none.
#
# Slave simulator UIDs (deterministic):
#   box_0  →  deadbeef00000000  (slots 0-3)
#   box_1  →  deadbeef00000001  (slots 4-7)
#
# Infinite-spool groups (slot_groups):
#   Tools 0 and 2 → group 1 (both in box_0)
#   Tool 4 and 6  → group 2 (both in box_1)
#   Others        → ungrouped
# ---------------------------------------------------------------------------

[mcu]
serial: /tmp/klipper_primary

[mcu pmu]
serial: /tmp/klipper_pmu

[printer]
kinematics: none
max_velocity: 100
max_accel: 100

# ---------------------------------------------------------------------------
# Pico-MMU plugin
# ---------------------------------------------------------------------------

[pico_mmu]
# "serial" here is the MCU section-name suffix used for printer.lookup_object("mcu pmu")
serial: pmu
rs485_baud: 115200
tool_count: 8
# slot_groups: tools 0,2 → group 1; tools 4,6 → group 2
slot_groups: 1,0,1,0,2,0,2,0

[pico_mmu_slave box_0]
unique_id: deadbeef00000000
slots: 0,1,2,3
colors: FF0000,00FF00,FF0000,00FF00

[pico_mmu_slave box_1]
unique_id: deadbeef00000001
slots: 4,5,6,7
colors: 0000FF,FFFF00,0000FF,FFFF00

# ---------------------------------------------------------------------------
# Save-variables (needed by pico_mmu to persist filament state)
# ---------------------------------------------------------------------------

[save_variables]
filename: /tmp/klipper_vars.cfg

# ---------------------------------------------------------------------------
# pause_resume — required for PAUSE / RESUME G-code from pico_mmu
# ---------------------------------------------------------------------------

[pause_resume]

