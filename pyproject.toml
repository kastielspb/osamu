[project]
name = "osamu"
version = "0.1.0"
description = "MMU firmware and host integration for Klipper"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires live Klipper + slave simulator (run via make integration-test)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"slave/motor/stepper.py" = ["F821"]
"slave/peripheral/led.py" = ["F821"]
"tests/micropython_shims/time.py" = ["F403"]
"tests/test_protocol_c.py" = ["E402"]
"tests/test_slave_dispatch.py" = ["E402"]
# pytest fixtures legitimately reuse names from outer scope (F811) and
# dependency-ordering fixtures appear unused to static analysis (F841/ARG001).
"tests/test_integration_klipper.py" = ["F811", "F841"]
