[project]
name = "osamu"
version = "0.1.0"
description = "MMU firmware and host integration for Klipper"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"slave/motor/stepper.py" = ["F821"]
"slave/peripheral/led.py" = ["F821"]
"tests/micropython_shims/time.py" = ["F403"]
"tests/test_protocol_c.py" = ["E402"]
"tests/test_slave_dispatch.py" = ["E402"]
"tests/e2e_harness.py" = ["F401"]
