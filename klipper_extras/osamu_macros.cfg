# OSAMU — Fluidd macro pack
#
# Wraps the MMU_* commands provided by [pico_mmu] in [gcode_macro] blocks
# so they show up as clickable buttons in the Fluidd / Mainsail macro panel.
#
# Usage — add to your printer.cfg:
#
#     [include /path/to/osamu/klipper_extras/osamu_macros.cfg]
#
# Notes:
# - The MMU_T0..MMU_T7 tool-change buttons assume the default `tool_count = 8`
#   in [pico_mmu]. Trim or extend the block to match your configuration.
# - Buttons that wrap an existing gcode command use the MMU_BTN_* prefix to
#   avoid collisions (e.g. MMU_BTN_HOME wraps MMU_HOME).
# - All buttons are visible by default; rename to start with `_` to hide one
#   from the panel while keeping it callable from gcode.

# ---------------------------------------------------------------------------
# Tool-change buttons — one click = one tool change
# ---------------------------------------------------------------------------

[gcode_macro MMU_T0]
description: Change to tool 0
gcode: MMU_CHANGE_TOOL TOOL=0

[gcode_macro MMU_T1]
description: Change to tool 1
gcode: MMU_CHANGE_TOOL TOOL=1

[gcode_macro MMU_T2]
description: Change to tool 2
gcode: MMU_CHANGE_TOOL TOOL=2

[gcode_macro MMU_T3]
description: Change to tool 3
gcode: MMU_CHANGE_TOOL TOOL=3

[gcode_macro MMU_T4]
description: Change to tool 4
gcode: MMU_CHANGE_TOOL TOOL=4

[gcode_macro MMU_T5]
description: Change to tool 5
gcode: MMU_CHANGE_TOOL TOOL=5

[gcode_macro MMU_T6]
description: Change to tool 6
gcode: MMU_CHANGE_TOOL TOOL=6

[gcode_macro MMU_T7]
description: Change to tool 7
gcode: MMU_CHANGE_TOOL TOOL=7

# ---------------------------------------------------------------------------
# Core action buttons — wrappers around existing MMU_* commands
# ---------------------------------------------------------------------------

[gcode_macro MMU_BTN_HOME]
description: Initialize and enumerate all slave boxes
gcode: MMU_HOME

[gcode_macro MMU_BTN_UNLOAD]
description: Retract the currently loaded filament
gcode: MMU_UNLOAD

[gcode_macro MMU_BTN_STATUS]
description: Print MMU and per-slot state to the console
gcode: MMU_STATUS

# ---------------------------------------------------------------------------
# Live dashboard — formats `printer.pico_mmu` into the console.
# Uses action_respond_info so it works without the optional [respond] extra.
# Avoid the '#' character inside templates: Klipper's config parser treats
# inline '#' as a comment marker and truncates the macro mid-string.
# ---------------------------------------------------------------------------

[gcode_macro MMU_BTN_DASH]
description: Print formatted live MMU state to the console
gcode:
    {% set m = printer.pico_mmu %}
    {action_respond_info("OSAMU state=" ~ m.state ~ " active=T" ~ m.current_tool|string ~ " target=T" ~ m.target_tool|string)}
    {% for t in m.tools %}
    {% set grp = ("  grp=" ~ t.group|string) if t.group else "" %}
    {% set off = "  [offline]" if not t.online else "" %}
    {% set mat = t.material if t.material else "-" %}
    {action_respond_info("  T" ~ t.tool|string ~ "  " ~ t.state ~ "  color=" ~ t.color ~ "  " ~ mat ~ grp ~ off)}
    {% endfor %}
